# ═══════════════════════════════════════════════════════════════════════════
#  SMS-2 IDOS — Render deployment blueprint
#  ─────────────────────────────────────────────────────────────────────────
#  SMS-2 is a long-running Python service that serves its own frontend and
#  writes to a database. That rules out static/serverless hosts such as
#  Vercel, Netlify or GitHub Pages: they have no always-on process and no
#  writable disk, so uvicorn cannot stay up and SQLite cannot persist.
#
#  Render runs it as an ordinary web service, which is what it needs.
#  Free tier note: the instance sleeps after ~15 minutes idle and the first
#  request afterwards takes ~30s to wake it. That is normal, not a fault.
#
#  Deploy: push this file, then on Render choose  New → Blueprint  and point
#  it at the repository. See DEPLOY.md for the click-by-click version.
# ═══════════════════════════════════════════════════════════════════════════
# ── DATABASE ───────────────────────────────────────────────────────────────
# Declared here so Render creates it and wires the URL itself. Render's free
# disk is EPHEMERAL: on SQLite the database resets on every deploy and every
# wake from sleep, which is fine for a demo but loses real production entry.
#
# NOTE: a free Postgres instance EXPIRES (Render currently gives 30 days).
# For the plant's real deployment this must be a paid instance or your own
# server — otherwise the database disappears and takes the heats with it.
databases:
  - name: sms2-db
    plan: free
    region: singapore

services:
  - type: web
    name: sms2-idos
    runtime: python
    plan: free
    region: singapore          # nearest region to India; change if you prefer
    rootDir: backend           # uvicorn is started from here, as it is locally
    buildCommand: pip install -r requirements.txt
    # $PORT is supplied by Render. Everything else matches deploy/run.sh.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # ── PLANT CLOCK ──────────────────────────────────────────────────────
      # Render runs in UTC. Without this the shift engine reads the server's
      # clock, so 17:39 in the shop is 12:09 on the host and B shift is
      # reported as A — and heats are filed against the wrong shift and day.
      - key: SMS2_PLANT_TZ
        value: Asia/Kolkata
      # Wired automatically from the database declared above — nothing to
      # paste, and no chance of pasting the External URL by mistake. Both
      # PostgreSQL drivers are installed; config.py explicitly selects
      # postgresql+psycopg so SQLAlchemy 2.0 and 2.1 behave consistently.
      - key: SMS2_DATABASE_URL
        fromDatabase:
          name: sms2-db
          property: connectionString
      # ── PLANT HISTORY ────────────────────────────────────────────────────
      # Set to 1 to load the committed history bundle (667 real heats) on the
      # first boot. Render's free tier has NO SHELL, so tools/seed_history.py
      # cannot be run after a deploy — this is how the data gets in. Runs once
      # (heats already present are skipped) and never blocks start-up.
      - key: SMS2_SEED_HISTORY
        sync: false
      # ── CREDENTIALS ──────────────────────────────────────────────────────
      # SET THESE. Without them the seed falls back to the defaults published
      # in app/seed.py, which would be the live passwords of a public site.
      - key: SMS2_ADMIN_PASSWORD
        sync: false
      - key: SMS2_SEED_PASSWORD
        sync: false
      # ── AI PRODUCTION ENGINEER ───────────────────────────────────────────
      # OPTIONAL. Leave unset and the deterministic rules engine answers, as
      # it always has — the reasoning layer simply never engages and no plant
      # data leaves the site. Set the KEY to turn reasoning on; the model name
      # is a separate, optional override and does nothing on its own.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Default is claude-opus-4-8. claude-fable-5 reasons harder at roughly
      # double the price and needs 30-day data retention on the account.
      - key: SMS2_AI_MODEL
        sync: false
